name: OpenWrt checks
on:
  push:
    paths: ['openwrt/**', '.github/workflows/openwrt-*.yml']
  pull_request:
    paths: ['openwrt/**', '.github/workflows/openwrt-*.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential dash openssl strace
      - run: python3 openwrt/tests/run_all.py
      - run: python3 openwrt/tests/test_sync_upstream.py
      - name: Run LuCI browser regression
        working-directory: openwrt/tests/browser
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          npx playwright test
