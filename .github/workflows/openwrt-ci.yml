name: OpenWrt checks
on:
  push:
    paths: ['openwrt/**', '.github/workflows/openwrt-*.yml']
  pull_request:
    paths: ['openwrt/**', '.github/workflows/openwrt-*.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: python3 openwrt/tests/run_all.py
      - run: python3 openwrt/tests/test_sync_upstream.py
